{% extends "base.html" %}

{% block body %}
<div class="classes-container classes-body">
    <div class="container">
        <div class="classes-header">
            <h1>Classes Directory</h1>
            <div class="search-container">
                <sl-input
                    id="searchBox"
                    type="search"
                    size="medium"
                    placeholder="Search by class name, code, department, or description..."
                    autocomplete="off"
                    clearable
                >
                    <sl-icon name="search" slot="prefix"></sl-icon>
                </sl-input>
            </div>
            <div class="filter-sort-container">
                <sl-select id="subjectFilter" value="" size="small" placeholder="All Subjects" class="chip-select" hoist>
                    <span slot="prefix" class="chip-eyebrow">Subject</span>
                    <sl-option value="">All Subjects</sl-option>
                </sl-select>

                <sl-select id="departmentFilter" value="" size="small" placeholder="All Departments" class="chip-select" hoist>
                    <span slot="prefix" class="chip-eyebrow">Department</span>
                    <sl-option value="">All Departments</sl-option>
                </sl-select>

                <sl-select id="sortSelect" value="name" size="small" class="chip-select" hoist>
                    <span slot="prefix" class="chip-eyebrow">Sort</span>
                    <sl-option value="name">Class Name</sl-option>
                    <sl-option value="code">Class Code</sl-option>
                    <sl-option value="credit">Credit</sl-option>
                    <sl-option value="ncaa">NCAA</sl-option>
                </sl-select>

                <sl-checkbox id="descendingCheck" size="small">Descending</sl-checkbox>
            </div>
            <div class="results-info-row">
                <div class="results-info" id="resultsInfo">Loading Classes...</div>
                <div class="view-toggle" role="group" aria-label="View mode">
                    <button type="button" id="viewList" aria-pressed="true" title="List view">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <button type="button" id="viewGrid" aria-pressed="false" title="Grid view">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="classes-grid" id="classesGrid">
            <div class="loading">Loading classes...</div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/classes.js') }}"></script>
{% endblock %}
