{% extends "base.html" %}

{% block body %}
<div class="classes-container classes-body">
    <div class="container">
    <div class="classes-header">
        <h1>Clubs Directory</h1>
        <div class="search-container">
            <sl-input
                id="searchBox"
                type="search"
                size="medium"
                placeholder="Search by Club name or type..."
                autocomplete="off"
                clearable
            >
                <sl-icon name="search" slot="prefix"></sl-icon>
            </sl-input>
        </div>
        <div class="filter-sort-container">
            <sl-select id="sortSelect" value="name" size="small" class="chip-select" hoist>
                <span slot="prefix" class="chip-eyebrow">Sort</span>
                <sl-option value="name">Club Name</sl-option>
                <sl-option value="type">Club type</sl-option>
            </sl-select>
            <sl-checkbox id="descendingCheck" size="small">Descending</sl-checkbox>
        </div>
        <div class="results-info" id="resultsInfo">Loading Clubs...</div>
    </div>

    <div class="classes-grid" id="classesGrid">
        <div class="loading">Loading Clubs...</div>
    </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/clubs.js') }}"></script>
{% endblock %}
