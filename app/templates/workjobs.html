{% extends "base.html" %}

{% block body %}
<div class="workjobs-container workjobs-body">
    <div class="container">
        <div class="workjobs-header">
            <h1>Workjobs Directory</h1>
            <div class="search-container">
                <sl-input
                    id="searchBox"
                    type="search"
                    size="medium"
                    placeholder="Search by name, location, or description..."
                    autocomplete="off"
                    clearable
                >
                    <sl-icon name="search" slot="prefix"></sl-icon>
                </sl-input>
            </div>
            <div class="results-info" id="resultsInfo">Loading workjobs...</div>
        </div>

        <p class="notice">
            <span class="notice__label">Note</span>
            This is for informational purposes only. Please do not excessively request workjobs.
        </p>

        <div class="workjobs-grid" id="workjobsGrid">
            <div class="loading">Loading workjobs...</div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/workjobs.js') }}"></script>
<script>
    // Load workjobs when page loads
    document.addEventListener('DOMContentLoaded', function() {
        loadWorkjobs();
    });
</script>
{% endblock %}
