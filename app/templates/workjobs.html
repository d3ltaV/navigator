{% extends "base.html" %}

{% block body %}
<div class="workjobs-container workjobs-body">
    <div class="container">
        <div class="workjobs-header">
            <h1>Workjobs Directory</h1>
            <div class="search-container">
                <sl-input
                    id="searchBox"
                    type="search"
                    size="medium"
                    placeholder="Search by name, location, or description..."
                    autocomplete="off"
                    clearable
                >
                    <sl-icon name="search" slot="prefix"></sl-icon>
                </sl-input>
            </div>
            <div class="results-info-row">
                <div class="results-info" id="resultsInfo">Loading workjobs...</div>
                <div class="view-toggle" role="group" aria-label="View mode">
                    <button type="button" id="viewList" aria-pressed="true" title="List view">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <button type="button" id="viewGrid" aria-pressed="false" title="Grid view">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <p class="notice">
            <span class="notice__label">Note</span>
            This is for informational purposes only. Please do not excessively request workjobs.
        </p>

        <div class="workjobs-grid" id="workjobsGrid">
            <div class="loading">Loading workjobs...</div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/workjobs.js') }}"></script>
<script>
    // Load workjobs when page loads
    document.addEventListener('DOMContentLoaded', function() {
        loadWorkjobs();
    });
</script>
{% endblock %}
